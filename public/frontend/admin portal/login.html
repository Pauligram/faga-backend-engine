<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAGA Admin Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Arial,sans-serif;color:#14243a}.card{width:min(440px,calc(100% - 32px));background:#fff;padding:32px;border-radius:16px;box-shadow:0 14px 45px #071a3318}h1{margin:0 0 8px}p{color:#607086;line-height:1.5}label{display:block;margin:18px 0 6px;font-weight:700}input{width:100%;padding:12px;border:1px solid #ccd5e0;border-radius:8px;font:inherit}button{width:100%;margin-top:22px;padding:13px;background:#071a33;color:white;border:0;border-radius:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.message{margin-top:14px;color:#b42318}a{color:#0b5cab}
</style></head><body><main class="card"><h1>FAGA Admin</h1>
<p>Sign in with an authorised administrator account.</p>
<form id="adminLogin">
    <label for="email">Email address</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    
     <div id="message" class="message" role="alert"></div> <a href="forgot-password.html" style="font-size: 14px; text-decoration: none; color: #007bff;">Forgot Password?</a>
    <button id="submit" type="submit">Sign in</button>
   
</form></main>
        <script src="../js/faga-api.js"></script>
        <script>document.getElementById('adminLogin').addEventListener('submit',async function(event){event.preventDefault();const button=document.getElementById('submit');const message=document.getElementById('message');button.disabled=true;message.textContent='';try{const result=await FagaAPI.login(document.getElementById('email').value.trim(),document.getElementById('password').value);const roles=(result.user&&Array.isArray(result.user.roles)?result.user.roles:[]).map(item=>typeof item==='string'?item:item.role);if(!roles.includes('admin')&&!roles.includes('super_admin')){FagaAPI.removeToken();throw new Error('This account does not have administrator access.');}window.location.href='index.html';}catch(error){message.textContent=error.message||(error.data&&error.data.message)||'Unable to sign in. Check your details and try again.';}finally{button.disabled=false;}});
</script></body></html>
