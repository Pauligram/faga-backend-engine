<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAGA Admin Portal - Password Recovery</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #212529; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-recovery-card { background: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); width: 100%; max-width: 400px; box-sizing: border-box; border-top: 4px solid #dc3545; }
        .admin-recovery-card h2 { margin-top: 0; color: #212529; text-align: center; font-weight: 8px; }
        .admin-recovery-card p { color: #555; font-size: 13px; text-align: center; margin-bottom: 25px; line-height: 1.6; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .btn-admin-submit { width: 100%; padding: 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-admin-submit:hover { background-color: #bd2130; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #dc3545; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="admin-recovery-card">
    <h2>Account Recovery</h2>
    <p>Security Clearance Check: Enter your email below to trigger database credential recovery protocols.</p>
    
    <form id="admin-recovery-form">
        <div class="form-group">
            <label for="admin-email">Customer Username/Email:</label>
            <input type="email" id="Customer-email" class="form-control" placeholder="Customer-email" required>
        </div>
        <button type="submit" class="btn-admin-submit">Authorize Reset Link</button>
    </form>

    <a href="login.html" class="back-link">Return to Login</a>
</div>

<script>
    document.getElementById('admin-recovery-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const adminEmailValue = document.getElementById('admin-email').value;
        
        alert(`🔒 User security token dispatched! A recovery email sequence has been routed directly to ${adminEmailValue}.`);
        window.location.href = 'login.html';
    });
</script>

</body>
</html>
