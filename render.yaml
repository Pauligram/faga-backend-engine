services:
  - type: web
    name: faga-backend-engine
    env: docker
    plan: free
    region: frankfurt # Change to 'ohio' if you picked that for your database
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
